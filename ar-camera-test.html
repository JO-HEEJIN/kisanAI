<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real AR Field Scanner - NASA Farm Navigators</title>

    <!-- MindAR + A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #000;
        }

        .ar-ui {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 999999;
            background: rgba(7, 23, 63, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .data-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 999999;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            font-size: 18px;
            font-weight: bold;
        }

        .location-info {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .soil-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .data-item {
            text-align: center;
        }

        .data-value {
            font-size: 24px;
            font-weight: bold;
            color: #ecf0f1;
        }

        .data-label {
            font-size: 12px;
            opacity: 0.8;
        }

        .start-btn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #27ae60, #229954);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 999999;
            text-align: center;
        }

        #ar-scene {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <!-- AR Scene -->
    <a-scene
        id="ar-scene"
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/targets/card.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no"
        embedded
        renderer="logarithmicDepthBuffer: true;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        style="display: none;">

        <a-assets>
            <a-asset-item id="soil-model" src="https://cdn.glitch.global/your-glitch-app/soil.glb"></a-asset-item>
        </a-assets>

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
            cursor="fuse: false; rayOrigin: mouse;"
            raycaster="far: 10000; objects: .clickable">
        </a-camera>

        <!-- AR Target -->
        <a-marker-camera preset="hiro">
            <!-- 3D Soil Data Visualization -->
            <a-box
                id="data-cube"
                position="0 0.5 0"
                scale="0.5 0.5 0.5"
                color="#27ae60"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
            </a-box>

            <!-- NASA Data Text -->
            <a-text
                id="nasa-data-text"
                value="Loading NASA Data..."
                position="0 1.5 0"
                align="center"
                color="#ecf0f1"
                scale="0.8 0.8 0.8">
            </a-text>

            <!-- Soil Moisture Indicator -->
            <a-cylinder
                id="moisture-indicator"
                position="-1 0.5 0"
                radius="0.1"
                height="1"
                color="#3498db">
            </a-cylinder>

            <!-- NDVI Indicator -->
            <a-cylinder
                id="ndvi-indicator"
                position="1 0.5 0"
                radius="0.1"
                height="1"
                color="#2ecc71">
            </a-cylinder>
        </a-marker-camera>
    </a-scene>

    <!-- UI Overlays -->
    <div class="ar-ui" id="ar-ui" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-size: 18px; font-weight: bold;">🥽 Field Scanner Active</div>
                <div id="gps-status" style="font-size: 14px; opacity: 0.8;">📍 Getting location...</div>
            </div>
            <button onclick="stopAR()" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold;">
                STOP
            </button>
        </div>
    </div>

    <div class="data-overlay" id="data-overlay" style="display: none;">
        <div class="location-info" id="location-info">
            📍 Loading GPS coordinates...
        </div>

        <div style="font-size: 20px; margin-bottom: 10px;">
            <span id="main-advice">🌱 Analyzing soil conditions...</span>
        </div>

        <div class="soil-data">
            <div class="data-item">
                <div class="data-value" id="moisture-value">--</div>
                <div class="data-label">💧 Soil Moisture</div>
            </div>
            <div class="data-item">
                <div class="data-value" id="ndvi-value">--</div>
                <div class="data-label">🌿 Vegetation Index</div>
            </div>
            <div class="data-item">
                <div class="data-value" id="temp-value">--</div>
                <div class="data-label">🌡️ Temperature</div>
            </div>
            <div class="data-item">
                <div class="data-value" id="quality-value">--</div>
                <div class="data-label">📊 Data Quality</div>
            </div>
        </div>
    </div>

    <!-- Start Button -->
    <button class="start-btn" id="start-btn" onclick="startAR()">
        🌾 Start Field Scanner
    </button>

    <!-- Loading -->
    <div class="loading" id="loading" style="display: none;">
        <div>🔄 Initializing AR Camera...</div>
        <div style="font-size: 14px; margin-top: 10px;">Point camera at the ground</div>
    </div>

    <script>
        let arStarted = false;
        let currentLocation = { lat: null, lon: null };
        let nasaData = { soil: null, ndvi: null };

        // Start AR Function
        async function startAR() {
            console.log('🚀 Starting Real AR Field Scanner...');

            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                // Get GPS Location
                await getCurrentLocation();

                // Start AR Scene
                const arScene = document.getElementById('ar-scene');
                arScene.style.display = 'block';

                // Start MindAR
                const sceneEl = document.querySelector('a-scene');
                await sceneEl.addEventListener('renderstart', () => {
                    console.log('✅ AR Scene started');

                    // Show UI
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('ar-ui').style.display = 'block';
                    document.getElementById('data-overlay').style.display = 'block';

                    arStarted = true;

                    // Start data updates
                    startDataUpdates();
                });

            } catch (error) {
                console.error('❌ AR Start failed:', error);
                alert('AR failed to start: ' + error.message);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('start-btn').style.display = 'block';
            }
        }

        // Stop AR Function
        function stopAR() {
            console.log('🛑 Stopping AR...');

            const arScene = document.getElementById('ar-scene');
            arScene.style.display = 'none';

            document.getElementById('ar-ui').style.display = 'none';
            document.getElementById('data-overlay').style.display = 'none';
            document.getElementById('start-btn').style.display = 'block';

            arStarted = false;
        }

        // Get Current GPS Location
        async function getCurrentLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation not supported'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLocation.lat = position.coords.latitude;
                        currentLocation.lon = position.coords.longitude;

                        console.log('📍 GPS Location:', currentLocation);

                        // Update UI
                        document.getElementById('location-info').textContent =
                            `📍 ${currentLocation.lat.toFixed(4)}, ${currentLocation.lon.toFixed(4)}`;
                        document.getElementById('gps-status').textContent =
                            `📍 ${currentLocation.lat.toFixed(4)}, ${currentLocation.lon.toFixed(4)}`;

                        resolve(currentLocation);
                    },
                    (error) => {
                        console.error('❌ GPS Error:', error);
                        reject(new Error('GPS location failed: ' + error.message));
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 300000
                    }
                );
            });
        }

        // Fetch NASA Data
        async function fetchNASAData() {
            if (!currentLocation.lat || !currentLocation.lon) {
                console.warn('⚠️ No GPS location for NASA data');
                return;
            }

            try {
                console.log('🛰️ Fetching NASA data for:', currentLocation);

                // Fetch SMAP soil data
                const soilResponse = await fetch(
                    `http://localhost:3001/api/smap/soil-moisture?lat=${currentLocation.lat}&lon=${currentLocation.lon}`
                );
                nasaData.soil = await soilResponse.json();

                // Fetch MODIS NDVI data
                const ndviResponse = await fetch(
                    `http://localhost:3001/api/modis/ndvi?lat=${currentLocation.lat}&lon=${currentLocation.lon}`
                );
                nasaData.ndvi = await ndviResponse.json();

                console.log('✅ NASA Data loaded:', nasaData);

                // Update AR display
                updateARDisplay();

            } catch (error) {
                console.error('❌ NASA Data fetch failed:', error);

                // Use fallback data
                nasaData.soil = {
                    surface_moisture: 0.25 + Math.random() * 0.5,
                    temperature: 20 + Math.random() * 15,
                    quality: 'estimated'
                };
                nasaData.ndvi = {
                    ndvi: 0.3 + Math.random() * 0.4,
                    temperature: 20 + Math.random() * 15,
                    quality: 'estimated'
                };

                updateARDisplay();
            }
        }

        // Update AR Display
        function updateARDisplay() {
            if (!nasaData.soil || !nasaData.ndvi) return;

            // Update 2D UI
            const moisture = Math.round((nasaData.soil.surface_moisture || 0) * 100);
            const ndvi = parseFloat(nasaData.ndvi.ndvi || 0).toFixed(2);
            const temp = Math.round(nasaData.soil.temperature || 20);
            const quality = nasaData.soil.quality || 'good';

            document.getElementById('moisture-value').textContent = moisture + '%';
            document.getElementById('ndvi-value').textContent = ndvi;
            document.getElementById('temp-value').textContent = temp + '°C';
            document.getElementById('quality-value').textContent = quality;

            // Generate advice
            let advice = '';
            if (moisture < 20) {
                advice = '🚨 URGENT: Irrigation needed!';
            } else if (moisture < 35) {
                advice = '💧 Consider watering soon';
            } else if (moisture > 80) {
                advice = '⚠️ Too wet - check drainage';
            } else {
                advice = '✅ Soil moisture optimal';
            }

            document.getElementById('main-advice').textContent = advice;

            // Update 3D AR elements
            const dataCube = document.getElementById('data-cube');
            const nasaText = document.getElementById('nasa-data-text');
            const moistureIndicator = document.getElementById('moisture-indicator');
            const ndviIndicator = document.getElementById('ndvi-indicator');

            if (dataCube) {
                // Change cube color based on soil condition
                if (moisture < 20) {
                    dataCube.setAttribute('color', '#e74c3c'); // Red
                } else if (moisture < 35) {
                    dataCube.setAttribute('color', '#f39c12'); // Orange
                } else {
                    dataCube.setAttribute('color', '#27ae60'); // Green
                }
            }

            if (nasaText) {
                nasaText.setAttribute('value',
                    `Moisture: ${moisture}%\\nNDVI: ${ndvi}\\nTemp: ${temp}°C`
                );
            }

            if (moistureIndicator) {
                moistureIndicator.setAttribute('height', moisture / 100 * 2);
                moistureIndicator.setAttribute('position', '-1 ' + (moisture / 100) + ' 0');
            }

            if (ndviIndicator) {
                ndviIndicator.setAttribute('height', parseFloat(ndvi) * 2);
                ndviIndicator.setAttribute('position', '1 ' + parseFloat(ndvi) + ' 0');
            }
        }

        // Start periodic data updates
        function startDataUpdates() {
            // Initial load
            fetchNASAData();

            // Update every 30 seconds
            setInterval(() => {
                if (arStarted && currentLocation.lat) {
                    fetchNASAData();
                }
            }, 30000);
        }

        // Handle device orientation for mobile
        window.addEventListener('load', () => {
            // Request device orientation permission for iOS
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
        });

        console.log('🌾 Real AR Field Scanner Ready!');
    </script>
</body>
</html>
