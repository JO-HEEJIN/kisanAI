<!DOCTYPE html>
<html>
<head>
    <title>Simple AR Test</title>
    <style>
        body {
            background: #222;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        #status {
            background: #000;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #0f0;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>🔍 Simple AR System Test</h1>

    <button onclick="testStep1()">1. Load Components</button>
    <button onclick="testStep2()">2. Initialize AR System</button>
    <button onclick="testStep3()">3. Test Interface</button>
    <button onclick="testStep4()">4. Full Integration</button>
    <button onclick="clearStatus()">Clear</button>

    <div id="status"></div>

    <!-- Load components in order -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="src/ar/ARSystem.js"></script>
    <script src="src/ar/ARIntegrationManager.js"></script>
    <script src="src/ar/TabNavigationGuard.js"></script>
    <script src="src/ar/ARInterfaceManager.js"></script>
    <script src="src/ar/ARSystemExtension.js"></script>

    <script>
        let log = (msg) => {
            const status = document.getElementById('status');
            const time = new Date().toTimeString().split(' ')[0];
            status.textContent += `[${time}] ${msg}\n`;
            status.scrollTop = status.scrollHeight;
            console.log(msg);
        };

        let clearStatus = () => {
            document.getElementById('status').textContent = '';
        };

        let testStep1 = () => {
            log('=== STEP 1: Component Loading ===');

            const components = ['BABYLON', 'ARSystem', 'ARIntegrationManager', 'TabNavigationGuard', 'ARInterfaceManager', 'ARSystemExtension'];

            components.forEach(comp => {
                if (window[comp]) {
                    log(`✓ ${comp} loaded`);
                } else {
                    log(`✗ ${comp} MISSING`);
                }
            });

            log('Component loading test complete');
        };

        let arIntegrationManager = null;
        let tabNavigationGuard = null;
        let arSystemExtension = null;

        let testStep2 = async () => {
            log('=== STEP 2: AR System Initialization ===');

            try {
                // Mock app
                const mockApp = {
                    switchTab: (tab) => {
                        log(`Mock app switching to: ${tab}`);
                        return true;
                    }
                };

                // Initialize TabNavigationGuard
                log('Creating TabNavigationGuard...');
                tabNavigationGuard = new window.TabNavigationGuard();
                log('Initializing TabNavigationGuard...');
                await tabNavigationGuard.initialize(mockApp);
                log('✓ TabNavigationGuard ready');

                // Initialize ARIntegrationManager
                log('Creating ARIntegrationManager...');
                arIntegrationManager = new window.ARIntegrationManager();
                log('Initializing ARIntegrationManager...');
                await arIntegrationManager.initialize(tabNavigationGuard);
                log('✓ ARIntegrationManager ready');

                // Check if ARSystem was created
                if (arIntegrationManager.arSystem) {
                    log('✓ ARSystem created inside ARIntegrationManager');
                    const status = arIntegrationManager.arSystem.getStatus();
                    log(`ARSystem status: ${JSON.stringify(status, null, 2)}`);
                } else {
                    log('✗ ARSystem NOT created');
                }

                log('AR System initialization complete');

            } catch (error) {
                log(`✗ Error in step 2: ${error.message}`);
                log(`Stack: ${error.stack}`);
            }
        };

        let arInterface = null;

        let testStep3 = async () => {
            log('=== STEP 3: Interface Testing ===');

            try {
                // Create ARInterfaceManager
                log('Creating ARInterfaceManager...');
                arInterface = new window.ARInterfaceManager();
                log('✓ ARInterfaceManager created');

                log('Initializing ARInterfaceManager...');
                await arInterface.initialize();
                log('✓ ARInterfaceManager initialized');

                // Check UI components
                if (arInterface.controlPanel) {
                    log('✓ Control panel created');
                } else {
                    log('✗ Control panel missing');
                }

                if (arInterface.dataOverlay) {
                    log('✓ Data overlay created');
                } else {
                    log('✗ Data overlay missing');
                }

                // Test NASA data
                log('Testing NASA data fetch...');
                await arInterface.refreshNASAData();
                log('✓ NASA data fetch completed');
                log(`Data: soil=${arInterface.nasaData.soilMoisture?.surface_moisture}, ndvi=${arInterface.nasaData.ndvi?.ndvi}`);

                log('Interface testing complete');

            } catch (error) {
                log(`✗ Error in step 3: ${error.message}`);
                log(`Stack: ${error.stack}`);
            }
        };

        let testStep4 = async () => {
            log('=== STEP 4: Full Integration ===');

            try {
                if (!arIntegrationManager || !arIntegrationManager.arSystem) {
                    log('✗ ARIntegrationManager not ready, run step 2 first');
                    return;
                }

                // Create ARSystemExtension
                log('Creating ARSystemExtension...');
                arSystemExtension = new window.ARSystemExtension(arIntegrationManager.arSystem);
                log('✓ ARSystemExtension created');

                log('Extending AR system...');
                await arSystemExtension.extendARSystem();
                log('✓ AR system extended');

                // Test enhanced AR start
                log('Testing enhanced AR start...');
                await arSystemExtension.startEnhancedAR();
                log('✓ Enhanced AR started');

                // Wait and stop
                setTimeout(async () => {
                    log('Stopping enhanced AR...');
                    await arSystemExtension.stopEnhancedAR();
                    log('✓ Enhanced AR stopped');
                }, 2000);

                log('Full integration test complete');

            } catch (error) {
                log(`✗ Error in step 4: ${error.message}`);
                log(`Stack: ${error.stack}`);
            }
        };

        // Auto-start
        window.addEventListener('load', () => {
            setTimeout(testStep1, 1000);
        });
    </script>
</body>
</html>
