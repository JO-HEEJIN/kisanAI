<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Camera Test</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #222;
            color: #0f0;
            margin: 0;
            padding: 20px;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background: #333;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
        }
        button:hover {
            background: #0f0;
            color: #222;
        }
        button:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
        }
        .status {
            background: #000;
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #0f0;
            border-radius: 5px;
            min-height: 100px;
            white-space: pre-wrap;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
        }
        .ar-preview {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 300px;
            margin: 20px auto;
            border: 2px solid #0f0;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        #ar-canvas, #ar-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .success { color: #00ff88; }
        .error { color: #ff4444; }
        .warning { color: #ffaa00; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🎥 AR Camera Test</h1>
        <p>Test the AR camera functionality with real camera feed</p>

        <div class="ar-preview" id="ar-preview">
            <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666;">
                Camera preview will appear here
            </div>
        </div>

        <div>
            <button onclick="testWebXRSupport()">Check WebXR Support</button>
            <button onclick="testCameraAccess()">Test Camera Access</button>
            <button onclick="startARTest()" id="start-ar-btn" disabled>Start AR Test</button>
            <button onclick="stopARTest()" id="stop-ar-btn" disabled>Stop AR Test</button>
            <button onclick="clearStatus()">Clear Status</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <!-- Load AR components -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="src/ar/ARSystem.js"></script>

    <script>
        let arSystem = null;
        let cameraSupported = false;
        let webxrSupported = false;

        const log = (message, type = 'info') => {
            const statusEl = document.getElementById('status');
            const time = new Date().toTimeString().split(' ')[0];
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            statusEl.innerHTML += `<span class="${className}">[${time}] ${message}</span>\n`;
            statusEl.scrollTop = statusEl.scrollHeight;
            console.log(message);
        };

        const clearStatus = () => {
            document.getElementById('status').innerHTML = '';
        };

        const updateButtonStates = () => {
            document.getElementById('start-ar-btn').disabled = !(cameraSupported && window.ARSystem);
            document.getElementById('stop-ar-btn').disabled = !arSystem || !arSystem.isActive;
        };

        const testWebXRSupport = async () => {
            log('🔍 Testing WebXR support...');

            if (!navigator.xr) {
                log('❌ WebXR not available in this browser', 'error');
                webxrSupported = false;
                return;
            }

            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (supported) {
                    log('✅ WebXR AR sessions supported', 'success');
                    webxrSupported = true;
                } else {
                    log('⚠️ WebXR available but AR not supported', 'warning');
                    webxrSupported = false;
                }
            } catch (error) {
                log(`❌ WebXR test failed: ${error.message}`, 'error');
                webxrSupported = false;
            }

            updateButtonStates();
        };

        const testCameraAccess = async () => {
            log('📹 Testing camera access...');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                log('✅ Camera access granted', 'success');
                log(`Camera specs: ${stream.getVideoTracks()[0].getSettings().width}x${stream.getVideoTracks()[0].getSettings().height}`);

                // Show camera preview
                const video = document.createElement('video');
                video.id = 'test-video';
                video.srcObject = stream;
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                video.style.cssText = 'width: 100%; height: 100%; object-fit: cover;';

                const preview = document.getElementById('ar-preview');
                preview.innerHTML = '';
                preview.appendChild(video);

                // Stop stream after 3 seconds
                setTimeout(() => {
                    stream.getTracks().forEach(track => track.stop());
                    log('📹 Test camera stream stopped');
                }, 3000);

                cameraSupported = true;

            } catch (error) {
                log(`❌ Camera access failed: ${error.message}`, 'error');
                cameraSupported = false;
            }

            updateButtonStates();
        };

        const startARTest = async () => {
            try {
                log('🚀 Starting AR test with camera...');

                if (!window.ARSystem) {
                    throw new Error('ARSystem not loaded');
                }

                // Create AR system
                arSystem = new window.ARSystem();
                log('✓ ARSystem instance created');

                // Initialize AR system
                await arSystem.initialize();
                log('✓ ARSystem initialized');

                // Start AR session
                await arSystem.startAR();
                log('✅ AR session started with camera!', 'success');

                // Move AR canvas to preview area
                const arCanvas = document.getElementById('ar-system-canvas');
                if (arCanvas) {
                    const preview = document.getElementById('ar-preview');
                    preview.innerHTML = '';
                    arCanvas.style.position = 'static';
                    arCanvas.style.width = '100%';
                    arCanvas.style.height = '100%';
                    preview.appendChild(arCanvas);
                    log('📱 AR canvas moved to preview area');
                }

                document.getElementById('start-ar-btn').disabled = true;
                document.getElementById('stop-ar-btn').disabled = false;

            } catch (error) {
                log(`❌ AR test failed: ${error.message}`, 'error');
                if (error.stack) {
                    log(`Stack: ${error.stack}`, 'error');
                }
            }
        };

        const stopARTest = async () => {
            try {
                log('🛑 Stopping AR test...');

                if (arSystem) {
                    await arSystem.cleanup();
                    arSystem = null;
                    log('✅ AR system stopped and cleaned up', 'success');
                }

                // Reset preview
                const preview = document.getElementById('ar-preview');
                preview.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #666;">Camera preview will appear here</div>';

                document.getElementById('start-ar-btn').disabled = false;
                document.getElementById('stop-ar-btn').disabled = true;

            } catch (error) {
                log(`❌ AR stop failed: ${error.message}`, 'error');
            }
        };

        // Auto-check on load
        window.addEventListener('load', () => {
            log('🌟 AR Camera Test loaded', 'success');
            setTimeout(() => {
                testWebXRSupport();
            }, 1000);
        });

        // Error handling
        window.addEventListener('error', (e) => {
            log(`💥 Global error: ${e.message}`, 'error');
        });
    </script>
</body>
</html>
