<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Farm Navigator AR - Real Soil Analysis</title>

    <!-- Three.js and MindAR -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
    }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 18px;
            background: linear-gradient(45deg, #27ae60, #229954);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.3);
            z-index: 1000;
            font-weight: 600;
            min-height: 60px;
        }

        #startButton:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .soil-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(7, 23, 63, 0.95);
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 14px;
            max-width: 280px;
            display: none;
            backdrop-filter: blur(10px);
            z-index: 100;
            border: 2px solid rgba(46, 204, 113, 0.3);
        }

        .soil-panel h3 {
            margin-bottom: 10px;
            color: #2ecc71;
            font-size: 16px;
        }

        .soil-panel .data-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .soil-panel .value {
            font-weight: bold;
            color: #81C784;
        }

        .nasa-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(14, 46, 126, 0.95);
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 14px;
            max-width: 280px;
            display: none;
            backdrop-filter: blur(10px);
            z-index: 100;
            border: 2px solid rgba(52, 152, 219, 0.3);
        }

        .nasa-panel h3 {
            margin-bottom: 10px;
            color: #3498db;
            font-size: 16px;
        }

        .status-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
            display: none;
            z-index: 100;
            border: 2px solid rgba(46, 204, 113, 0.5);
        }

        .gps-info {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(52, 152, 219, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
            z-index: 100;
        }

        .scanning {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Mobile optimization */
        @media (max-width: 768px) {
            .soil-panel, .nasa-panel {
                max-width: 200px;
                font-size: 12px;
                padding: 10px;
            }

            .soil-panel h3, .nasa-panel h3 {
                font-size: 14px;
            }

            #startButton {
                padding: 15px 30px;
                font-size: 16px;
            }
        }

        /* iOS specific */
        @supports (-webkit-touch-callout: none) {
            #startButton {
                -webkit-tap-highlight-color: transparent;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <button id="startButton">🌾 Start NASA Farm AR</button>

        <div class="soil-panel" id="soilPanel">
            <h3>🌱 Soil Analysis</h3>
            <div class="data-row">
                <span>Clay</span>
                <span class="value" id="clay">--%</span>
            </div>
            <div class="data-row">
                <span>Sand</span>
                <span class="value" id="sand">--%</span>
            </div>
            <div class="data-row">
                <span>Silt</span>
                <span class="value" id="silt">--%</span>
            </div>
            <div class="data-row">
                <span>pH Level</span>
                <span class="value" id="ph">--</span>
            </div>
            <div class="data-row">
                <span>Moisture</span>
                <span class="value" id="moisture">--%</span>
            </div>
            <div class="data-row">
                <span>Organic Matter</span>
                <span class="value" id="organic">--%</span>
            </div>
        </div>

        <div class="nasa-panel" id="nasaPanel">
            <h3>🛰️ NASA Satellite Data</h3>
            <div class="data-row">
                <span>NDVI</span>
                <span class="value" id="ndvi">--</span>
            </div>
            <div class="data-row">
                <span>Soil Moisture</span>
                <span class="value" id="soilMoistureSat">-- m³/m³</span>
            </div>
            <div class="data-row">
                <span>Temperature</span>
                <span class="value" id="temperature">--°C</span>
            </div>
            <div class="data-row">
                <span>Crop Health</span>
                <span class="value" id="cropHealth">--</span>
            </div>
            <div class="data-row">
                <span>Location</span>
                <span class="value" id="location">--</span>
            </div>
        </div>

        <div class="gps-info" id="gpsInfo">
            📍 GPS: <span id="gpsCoords">Getting location...</span>
        </div>

        <div class="status-indicator" id="status">
            <span class="scanning">Looking for soil sample...</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        class NASAFarmAR {
            constructor() {
                this.mindarThree = null;
                this.soilModel = null;
                this.arPanels = [];
                this.isAnalyzing = false;
                this.gpsLocation = { lat: null, lon: null };
                this.nasaData = { soil: null, ndvi: null };
                this.init();
            }

            async init() {
                const startButton = document.getElementById('startButton');
                startButton.addEventListener('click', async () => {
                    const hasPermissions = await this.requestPermissions();
                    if (hasPermissions) {
                        startButton.style.display = 'none';
                        await this.getGPSLocation();
                        this.startAR();
                    }
                });
            }

            async requestPermissions() {
                // iOS sensor permissions
                if (typeof DeviceOrientationEvent !== 'undefined' &&
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const orientationPermission = await DeviceOrientationEvent.requestPermission();
                        const motionPermission = await DeviceMotionEvent.requestPermission();

                        if (orientationPermission !== 'granted' || motionPermission !== 'granted') {
                            alert('AR requires sensor permissions.');
                            return false;
                        }
                    } catch (error) {
                        console.error('iOS sensor permission error:', error);
                    }
                }

                // Camera permission
                try {
                    await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' }
                    });
                } catch (error) {
                    alert('Camera permission required for AR.');
                    return false;
                }

                return true;
            }

            async getGPSLocation() {
                document.getElementById('gpsInfo').style.display = 'block';

                return new Promise((resolve) => {
                    if (!navigator.geolocation) {
                        this.setFallbackLocation();
                        resolve();
                        return;
                    }

                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            this.gpsLocation.lat = position.coords.latitude;
                            this.gpsLocation.lon = position.coords.longitude;

                            document.getElementById('gpsCoords').textContent =
                                `${this.gpsLocation.lat.toFixed(4)}, ${this.gpsLocation.lon.toFixed(4)}`;

                            console.log('📍 GPS Location:', this.gpsLocation);
                            resolve();
                        },
                        (error) => {
                            console.error('GPS error:', error);
                            this.setFallbackLocation();
                            resolve();
                        },
                        {
                            enableHighAccuracy: true,
                            timeout: 10000,
                            maximumAge: 300000
                        }
                    );
                });
            }

            setFallbackLocation() {
                // Default to Arizona farm location
                this.gpsLocation.lat = 33.4484;
                this.gpsLocation.lon = -111.9409;
                document.getElementById('gpsCoords').textContent =
                    `${this.gpsLocation.lat.toFixed(4)}, ${this.gpsLocation.lon.toFixed(4)} (fallback)`;
            }

            async startAR() {
                console.log('🚀 Starting NASA Farm AR...');

                // Use MindAR default target for now
                const targetSrc = 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind';

                this.mindarThree = new MindARThree({
                    container: document.querySelector('#container'),
                    imageTargetSrc: targetSrc,
                    uiLoading: 'no',
                    uiScanning: 'no',
                    uiError: 'no'
                });

                const { renderer, scene, camera } = this.mindarThree;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(0, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);

                // AR Anchor (content appears when target is detected)
                const anchor = this.mindarThree.addAnchor(0);

                // Create 3D soil visualization
                this.createSoilVisualization(anchor);

                // Create AR information panels
                this.createARPanels(anchor);

                // Load NASA data
                await this.fetchNASAData();

                // Start AR
                await this.mindarThree.start();

                // Render loop
                renderer.setAnimationLoop(() => {
                    renderer.render(scene, camera);
                    this.updateAnalysis();
                });

                // Show status
                document.getElementById('status').style.display = 'block';

                // Target detection events
                anchor.onTargetFound = () => {
                    console.log('🎯 Target detected! Starting analysis...');
                    this.startAnalysis();
                };

                anchor.onTargetLost = () => {
                    console.log('❌ Target lost');
                    this.stopAnalysis();
                };
            }

            createSoilVisualization(anchor) {
                // 3D Soil layers
                const soilLayers = [
                    { color: 0x8B4513, height: 0.4, name: 'TopSoil', y: 0.2 },
                    { color: 0x654321, height: 0.3, name: 'SubSoil', y: -0.15 },
                    { color: 0x3E2723, height: 0.2, name: 'Parent', y: -0.4 }
                ];

                soilLayers.forEach(layer => {
                    const geometry = new THREE.BoxGeometry(1.2, layer.height, 1.2);
                    const material = new THREE.MeshPhongMaterial({
                        color: layer.color,
                        transparent: true,
                        opacity: 0.8
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.y = layer.y;
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    anchor.group.add(mesh);
                });

                // Water particles animation
                const particleCount = 30;
                const particlesGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 1;
                    positions[i + 1] = Math.random() * 0.8 - 0.2;
                    positions[i + 2] = (Math.random() - 0.5) * 1;
                }

                particlesGeometry.setAttribute('position',
                    new THREE.BufferAttribute(positions, 3));

                const particlesMaterial = new THREE.PointsMaterial({
                    color: 0x00aaff,
                    size: 0.03,
                    transparent: true,
                    opacity: 0.7
                });

                const particles = new THREE.Points(particlesGeometry, particlesMaterial);
                anchor.group.add(particles);

                // Store reference for animation
                this.moistureParticles = particles;

                // NASA satellite icon
                const iconGeometry = new THREE.SphereGeometry(0.1, 16, 16);
                const iconMaterial = new THREE.MeshPhongMaterial({
                    color: 0x3498db,
                    emissive: 0x1a5fb4
                });
                const satelliteIcon = new THREE.Mesh(iconGeometry, iconMaterial);
                satelliteIcon.position.set(0, 1.2, 0);
                anchor.group.add(satelliteIcon);

                // Store reference for animation
                this.satelliteIcon = satelliteIcon;
            }

            createARPanels(anchor) {
                // Soil data panel (3D text on canvas)
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 256;

                const texture = new THREE.CanvasTexture(canvas);

                const panelGeometry = new THREE.PlaneGeometry(1.5, 0.75);
                const panelMaterial = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.DoubleSide
                });

                const soilPanel = new THREE.Mesh(panelGeometry, panelMaterial);
                soilPanel.position.set(-1.5, 0.8, 0);
                soilPanel.rotation.y = 0.3;
                anchor.group.add(soilPanel);

                this.arPanels.push({
                    type: 'soil',
                    mesh: soilPanel,
                    texture,
                    context
                });

                // NASA data panel
                const nasaCanvas = document.createElement('canvas');
                const nasaContext = nasaCanvas.getContext('2d');
                nasaCanvas.width = 512;
                nasaCanvas.height = 256;

                const nasaTexture = new THREE.CanvasTexture(nasaCanvas);

                const nasaPanelMaterial = new THREE.MeshBasicMaterial({
                    map: nasaTexture,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.DoubleSide
                });

                const nasaPanel = new THREE.Mesh(panelGeometry, nasaPanelMaterial);
                nasaPanel.position.set(1.5, 0.8, 0);
                nasaPanel.rotation.y = -0.3;
                anchor.group.add(nasaPanel);

                this.arPanels.push({
                    type: 'nasa',
                    mesh: nasaPanel,
                    texture: nasaTexture,
                    context: nasaContext
                });
            }

            async fetchNASAData() {
                if (!this.gpsLocation.lat || !this.gpsLocation.lon) {
                    console.warn('⚠️ No GPS location for NASA data');
                    return;
                }

                try {
                    console.log('🛰️ Fetching NASA data for:', this.gpsLocation);

                    // Fetch SMAP soil data
                    const soilResponse = await fetch(
                        `http://172.16.1.96:3001/api/smap/soil-moisture?lat=${this.gpsLocation.lat}&lon=${this.gpsLocation.lon}`
                    );
                    this.nasaData.soil = await soilResponse.json();

                    // Fetch MODIS NDVI data
                    const ndviResponse = await fetch(
                        `http://172.16.1.96:3001/api/modis/ndvi?lat=${this.gpsLocation.lat}&lon=${this.gpsLocation.lon}`
                    );
                    this.nasaData.ndvi = await ndviResponse.json();

                    console.log('✅ NASA Data loaded:', this.nasaData);

                } catch (error) {
                    console.error('❌ NASA Data fetch failed:', error);

                    // Use fallback data
                    this.nasaData.soil = {
                        surface_moisture: 0.25 + Math.random() * 0.5,
                        temperature: 20 + Math.random() * 15,
                        quality: 'estimated'
                    };
                    this.nasaData.ndvi = {
                        ndvi: 0.3 + Math.random() * 0.4,
                        temperature: 20 + Math.random() * 15,
                        quality: 'estimated'
                    };
                }
            }

            startAnalysis() {
                this.isAnalyzing = true;
                document.getElementById('soilPanel').style.display = 'block';
                document.getElementById('nasaPanel').style.display = 'block';
                document.getElementById('status').innerHTML =
                    '<span class="scanning">🔬 Analyzing soil sample...</span>';

                // Start analysis
                this.performAnalysis();
            }

            stopAnalysis() {
                this.isAnalyzing = false;
                document.getElementById('status').innerHTML =
                    '<span class="scanning">📱 Point camera at a card or image...</span>';
            }

            async performAnalysis() {
                if (!this.isAnalyzing) return;

                // Simulate AI soil analysis based on NASA data
                const moisture = this.nasaData.soil ?
                    Math.round(this.nasaData.soil.surface_moisture * 100) :
                    Math.random() * 40 + 20;

                const soilData = {
                    clay: Math.random() * 30 + 20,
                    sand: Math.random() * 30 + 30,
                    silt: Math.random() * 30 + 20,
                    ph: Math.random() * 2 + 6,
                    moisture: moisture,
                    organic: Math.random() * 5 + 2
                };

                // Update 2D UI
                document.getElementById('clay').textContent =
                    soilData.clay.toFixed(1) + '%';
                document.getElementById('sand').textContent =
                    soilData.sand.toFixed(1) + '%';
                document.getElementById('silt').textContent =
                    soilData.silt.toFixed(1) + '%';
                document.getElementById('ph').textContent =
                    soilData.ph.toFixed(1);
                document.getElementById('moisture').textContent =
                    soilData.moisture.toFixed(1) + '%';
                document.getElementById('organic').textContent =
                    soilData.organic.toFixed(1) + '%';

                // Update NASA UI
                const ndvi = this.nasaData.ndvi ?
                    this.nasaData.ndvi.ndvi :
                    (Math.random() * 0.4 + 0.5);
                const temp = this.nasaData.soil ?
                    this.nasaData.soil.temperature :
                    (Math.random() * 10 + 18);

                document.getElementById('ndvi').textContent =
                    parseFloat(ndvi).toFixed(3);
                document.getElementById('soilMoistureSat').textContent =
                    (moisture / 100 * 0.4).toFixed(2) + ' m³/m³';
                document.getElementById('temperature').textContent =
                    Math.round(temp) + '°C';
                document.getElementById('cropHealth').textContent =
                    ndvi > 0.7 ? 'Excellent' : ndvi > 0.5 ? 'Good' : 'Needs Attention';
                document.getElementById('location').textContent =
                    `${this.gpsLocation.lat.toFixed(2)}, ${this.gpsLocation.lon.toFixed(2)}`;

                // Update 3D AR panels
                this.updateARPanels(soilData, {
                    ndvi: ndvi,
                    soilMoisture: (moisture / 100 * 0.4).toFixed(2),
                    temperature: Math.round(temp),
                    cropHealth: ndvi > 0.7 ? 'Excellent' : ndvi > 0.5 ? 'Good' : 'Needs Attention'
                });

                // Re-analyze every 3 seconds
                setTimeout(() => this.performAnalysis(), 3000);
            }

            updateARPanels(soilData, nasaData) {
                // Update soil panel
                const soilPanel = this.arPanels.find(p => p.type === 'soil');
                if (soilPanel) {
                    const { context, texture } = soilPanel;

                    // Clear canvas
                    context.fillStyle = 'rgba(7, 23, 63, 0.9)';
                    context.fillRect(0, 0, 512, 256);

                    // Title
                    context.fillStyle = '#2ecc71';
                    context.font = 'bold 28px Arial';
                    context.fillText('🌱 Soil Analysis', 20, 40);

                    // Data
                    context.fillStyle = 'white';
                    context.font = '18px Arial';
                    context.fillText(`Clay: ${soilData.clay.toFixed(1)}%`, 20, 80);
                    context.fillText(`Sand: ${soilData.sand.toFixed(1)}%`, 20, 110);
                    context.fillText(`pH: ${soilData.ph.toFixed(1)}`, 20, 140);
                    context.fillText(`Moisture: ${soilData.moisture.toFixed(1)}%`, 20, 170);

                    // Recommendation
                    context.fillStyle = '#f39c12';
                    context.font = 'bold 16px Arial';
                    const recommendation = soilData.ph < 6.5 ?
                        '⚠️ Add lime recommended' :
                        soilData.moisture < 25 ?
                        '💧 Irrigation needed' :
                        '✅ Soil conditions good';
                    context.fillText(recommendation, 20, 220);

                    texture.needsUpdate = true;
                }

                // Update NASA panel
                const nasaPanel = this.arPanels.find(p => p.type === 'nasa');
                if (nasaPanel) {
                    const { context, texture } = nasaPanel;

                    // Clear canvas
                    context.fillStyle = 'rgba(14, 46, 126, 0.9)';
                    context.fillRect(0, 0, 512, 256);

                    // Title
                    context.fillStyle = '#3498db';
                    context.font = 'bold 28px Arial';
                    context.fillText('🛰️ NASA Data', 20, 40);

                    // Data
                    context.fillStyle = 'white';
                    context.font = '18px Arial';
                    context.fillText(`NDVI: ${nasaData.ndvi.toFixed(3)}`, 20, 80);
                    context.fillText(`Soil Moisture: ${nasaData.soilMoisture} m³/m³`, 20, 110);
                    context.fillText(`Temperature: ${nasaData.temperature}°C`, 20, 140);
                    context.fillText(`Crop Health: ${nasaData.cropHealth}`, 20, 170);

                    // NDVI recommendation
                    context.fillStyle = '#1abc9c';
                    context.font = 'bold 16px Arial';
                    const ndviStatus = parseFloat(nasaData.ndvi) > 0.7 ?
                        '🌟 Vegetation excellent' :
                        parseFloat(nasaData.ndvi) > 0.5 ?
                        '🌿 Vegetation good' :
                        '⚠️ Irrigation needed';
                    context.fillText(ndviStatus, 20, 220);

                    texture.needsUpdate = true;
                }
            }

            updateAnalysis() {
                if (this.isAnalyzing) {
                    // Animate moisture particles
                    if (this.moistureParticles) {
                        this.moistureParticles.rotation.y += 0.01;
                    }

                    // Animate satellite icon
                    if (this.satelliteIcon) {
                        this.satelliteIcon.rotation.y += 0.02;
                        this.satelliteIcon.position.y = 1.2 + Math.sin(Date.now() * 0.002) * 0.1;
                    }

                    // Animate AR panels
                    this.arPanels.forEach((panel, index) => {
                        panel.mesh.rotation.x = Math.sin(Date.now() * 0.001 + index) * 0.05;
                    });
                }
            }
        }

        // Start the app
        window.addEventListener('DOMContentLoaded', () => {
            new NASAFarmAR();
        });

        console.log('🌾 NASA Farm AR Ready!');
    </script>
</body>
</html>
