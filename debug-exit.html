<!DOCTYPE html>
<html>
<head>
    <title>Exit AR Debug</title>
    <style>
        body { background: #222; color: #0f0; font-family: monospace; padding: 20px; }
        button { background: #333; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; margin: 5px; cursor: pointer; }
        #log { background: #000; padding: 10px; margin: 10px 0; height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .error { color: #f00; }
        .success { color: #0f0; }
        .warning { color: #ff0; }
    </style>
</head>
<body>
    <h1>🐛 Exit AR Debug Tool</h1>
    <button onclick="startARTest()">Start AR Test</button>
    <button onclick="forceExitAll()">Force Exit ALL</button>
    <button onclick="findAllARElements()">Find AR Elements</button>
    <button onclick="debugExitButton()">Debug Exit Button</button>
    <button onclick="clearLog()">Clear</button>

    <div id="log"></div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="src/ar/ARSystem.js"></script>
    <script src="src/ar/ARIntegrationManager.js"></script>
    <script src="src/ar/TabNavigationGuard.js"></script>
    <script src="src/ar/ARInterfaceManager.js"></script>
    <script src="src/ar/ARSystemExtension.js"></script>

    <script>
        const log = (msg, type = 'info') => {
            const el = document.getElementById('log');
            const time = new Date().toTimeString().split(' ')[0];
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            el.innerHTML += `<span class="${className}">[${time}] ${msg}</span>\n`;
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        };

        const clearLog = () => document.getElementById('log').innerHTML = '';

        let arSystemExtension, arIntegrationManager, tabGuard;

        const startARTest = async () => {
            try {
                log('🚀 Starting AR test to debug exit...');

                // Mock app
                const mockApp = { switchTab: (tab) => { log(`Tab switch: ${tab}`); return true; }};

                // Initialize everything
                tabGuard = new window.TabNavigationGuard();
                await tabGuard.initialize(mockApp);
                log('✓ TabGuard ready');

                arIntegrationManager = new window.ARIntegrationManager();
                window.arIntegrationManager = arIntegrationManager;
                await arIntegrationManager.initialize(tabGuard);
                log('✓ ARIntegrationManager ready');

                if (arIntegrationManager.arSystem) {
                    arSystemExtension = new window.ARSystemExtension(arIntegrationManager.arSystem);
                    window.arSystemExtension = arSystemExtension;
                    await arSystemExtension.extendARSystem();
                    log('✓ ARSystemExtension ready');
                } else {
                    log('✗ ARSystem missing', 'error');
                    return;
                }

                // Start enhanced AR
                await arSystemExtension.startEnhancedAR();
                log('✅ Enhanced AR started - Now try to find exit button...', 'success');

                // Find exit button
                setTimeout(() => {
                    debugExitButton();
                }, 2000);

            } catch (error) {
                log(`❌ AR test failed: ${error.message}`, 'error');
            }
        };

        const debugExitButton = () => {
            log('🔍 Looking for exit button...');

            // Find all possible exit buttons
            const selectors = [
                '#exit-ar-btn',
                'button[id*="exit"]',
                'button[id*="ar"]',
                '[onclick*="stop"]',
                '[onclick*="exit"]',
                '[onclick*="close"]'
            ];

            let found = false;
            selectors.forEach(selector => {
                const elements = document.querySelectorAll(selector);
                if (elements.length > 0) {
                    elements.forEach((el, i) => {
                        log(`✓ Found: ${selector} [${i}] - ${el.textContent} - onclick: ${el.onclick ? 'YES' : 'NO'}`);
                        found = true;

                        // Try to click it
                        if (el.onclick || el.getAttribute('onclick')) {
                            log(`🖱️ Attempting to click: ${el.textContent}`);
                            try {
                                el.click();
                                log(`✓ Click executed on: ${el.textContent}`, 'success');
                            } catch (e) {
                                log(`❌ Click failed: ${e.message}`, 'error');
                            }
                        }
                    });
                }
            });

            if (!found) {
                log('❌ No exit button found!', 'error');
            }

            // Check global AR objects
            log('🔍 Checking global AR objects...');
            if (window.arSystemExtension) {
                log('✓ window.arSystemExtension exists');
            }
            if (window.arIntegrationManager) {
                log('✓ window.arIntegrationManager exists');
            }
        };

        const findAllARElements = () => {
            log('🔍 Finding ALL AR elements on page...');

            const allElements = document.querySelectorAll('*');
            let arElements = [];

            allElements.forEach(el => {
                if (el.id && el.id.includes('ar-')) {
                    arElements.push(el);
                }
            });

            log(`Found ${arElements.length} AR elements:`);
            arElements.forEach(el => {
                const display = window.getComputedStyle(el).display;
                const visibility = window.getComputedStyle(el).visibility;
                log(`  • ${el.id} - ${el.tagName} - display:${display} visibility:${visibility} - "${el.textContent?.substring(0,30)}"`);
            });

            // Check for any elements with z-index > 10000
            const highZElements = [];
            allElements.forEach(el => {
                const zIndex = window.getComputedStyle(el).zIndex;
                if (parseInt(zIndex) > 10000) {
                    highZElements.push(el);
                }
            });

            log(`Found ${highZElements.length} high z-index elements:`);
            highZElements.forEach(el => {
                log(`  • ${el.id || el.className} - z-index:${window.getComputedStyle(el).zIndex}`);
            });
        };

        const forceExitAll = () => {
            log('🚨 FORCE EXITING ALL AR COMPONENTS...');

            // 1. Try global cleanup functions
            if (window.arSystemExtension) {
                try {
                    window.arSystemExtension.stopEnhancedAR();
                    log('✓ Called arSystemExtension.stopEnhancedAR()');
                } catch (e) {
                    log(`❌ stopEnhancedAR failed: ${e.message}`, 'error');
                }

                try {
                    window.arSystemExtension.cleanup();
                    log('✓ Called arSystemExtension.cleanup()');
                } catch (e) {
                    log(`❌ arSystemExtension.cleanup failed: ${e.message}`, 'error');
                }
            }

            if (window.arIntegrationManager) {
                try {
                    window.arIntegrationManager.stopAR();
                    log('✓ Called arIntegrationManager.stopAR()');
                } catch (e) {
                    log(`❌ arIntegrationManager.stopAR failed: ${e.message}`, 'error');
                }

                try {
                    window.arIntegrationManager.cleanup();
                    log('✓ Called arIntegrationManager.cleanup()');
                } catch (e) {
                    log(`❌ arIntegrationManager.cleanup failed: ${e.message}`, 'error');
                }
            }

            // 2. Force remove ALL AR elements
            const arSelectors = [
                '[id*="ar-"]',
                '[class*="ar-"]',
                'canvas[id*="ar"]',
                'video[id*="ar"]',
                'div[id*="ar"]'
            ];

            let removedCount = 0;
            arSelectors.forEach(selector => {
                const elements = document.querySelectorAll(selector);
                elements.forEach(el => {
                    el.remove();
                    removedCount++;
                });
            });
            log(`🗑️ Force removed ${removedCount} AR elements`);

            // 3. Reset all global AR variables
            window.arSystemExtension = null;
            window.arIntegrationManager = null;
            window.arSystem = null;
            log('🔄 Reset all global AR variables');

            log('🎉 FORCE EXIT COMPLETED!', 'success');
        };

        // Auto-detect AR elements every 5 seconds
        setInterval(() => {
            const arElements = document.querySelectorAll('[id*="ar-"]');
            if (arElements.length > 0) {
                log(`⚠️ Still ${arElements.length} AR elements present`, 'warning');
            }
        }, 5000);

        window.addEventListener('error', (e) => {
            log(`💥 Error: ${e.message}`, 'error');
        });
    </script>
</body>
</html>
